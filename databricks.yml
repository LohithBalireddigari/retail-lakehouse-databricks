# Databricks Asset Bundle: deploy with `databricks bundle deploy -t dev`
bundle:
  name: retail-lakehouse

variables:
  catalog:
    default: workspace
  schema:
    default: retail

resources:
  jobs:
    retail_lakehouse_pipeline:
      name: retail-lakehouse-pipeline
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # daily 06:00
        timezone_id: America/Chicago
        pause_status: PAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest.py
        - task_key: silver_transform
          depends_on: [{ task_key: bronze_ingest }]
          notebook_task:
            notebook_path: ./notebooks/02_silver_transform.py
        - task_key: gold_aggregates
          depends_on: [{ task_key: silver_transform }]
          notebook_task:
            notebook_path: ./notebooks/03_gold_aggregates.py
        - task_key: data_quality
          depends_on: [{ task_key: gold_aggregates }]
          notebook_task:
            notebook_path: ./notebooks/04_data_quality.py

targets:
  dev:
    mode: development
    default: true
